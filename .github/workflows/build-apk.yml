name: Build Android APK (SMS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor Dependencies & Prepare Web Bundle
        run: |
          npm install
          npm run build:web

      - name: Initialize Android Platform & Inject App Icons + Internet Permissions
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application/' "$MANIFEST"
          fi

          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp assets/icon-512.png "$dir/ic_launcher.png"
              cp assets/icon-512.png "$dir/ic_launcher_round.png"
              cp assets/icon-512.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Debug APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMS-Supplier-Management-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
